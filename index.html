<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
    <title>Valorant Scout</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <svg style="display: none;">
        <defs>
            <filter id="liquid-glass">
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <header class="top-bar">
        <div class="header-left">
            <button type="button" id="close-app-btn" class="close-btn" title="Close App">X</button>
            <span class="app-title">Valorant Scout</span>

            <p class="status">
                <span class="status-dot" id="status-indicator"></span>
                <span id="status-text">Connecting to Riot Client…</span>
            </p>
        </div>

        <div class="toolbar">
            <button type="button" id="overview-btn" title="Back to match overview">Overview</button>
            <button type="button" id="back-btn" title="Go back in this profile">Back</button>
            <button type="button" id="refresh-btn" title="Sync lobby data">Sync</button>
            <button type="button" id="delete-btn" class="danger" title="Delete the selected match">Delete match</button>
        </div>
    </header>

    <section class="match-history">
        <h2 class="bar-label">Matches</h2>
        <div id="match-tabs-list"></div>
    </section>

    <nav id="player-tabs-bar" aria-label="Players in this match"></nav>

    <main id="content">
        <section id="match-overview">
            <header class="overview-head">
                <div>
                    <h2 id="overview-map">Match</h2>
                    <p id="overview-meta"></p>
                </div>
                <button type="button" id="match-page-btn" title="Open the tracker.gg match page">Match page</button>
            </header>

            <div class="rosters">
                <section class="roster roster-ally">
                    <h3 class="roster-title">Your team</h3>
                    <ol class="roster-list" id="roster-ally"></ol>
                </section>

                <div class="roster-divider"><span>VS</span></div>

                <section class="roster roster-enemy">
                    <h3 class="roster-title">Enemy team</h3>
                    <ol class="roster-list" id="roster-enemy"></ol>
                </section>
            </div>
        </section>

        <section id="match-page">
            <webview id="match-webview" partition="persist:tracker"
                useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                allowpopups>
            </webview>
        </section>

        <div id="views-container"></div>
    </main>

    <script src="renderer.js"></script>
</body>

</html>
